[project]
name = "xhand1-simulation"
version = "0.1.0"
description = "Reproducible MuJoCo validation experiments for XHAND1"
requires-python = ">=3.10,<3.11"
dependencies = [
  "mujoco==3.10.0",
  "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: full nominal or robustness simulation",
]
